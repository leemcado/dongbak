<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부스 시작 — 동아리 박람회 퀴즈</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;
    font:400 20px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
  body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
  main{max-width:620px;text-align:center}
  h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
  p{color:rgba(255,255,255,.62);margin:0 0 30px;font-size:17px}
  button{font:700 24px/1 inherit;background:#fff;color:#000;border:0;
    padding:20px 46px;cursor:pointer;letter-spacing:.02em}
  button:hover{background:#ddd}
  #alt{margin-top:34px;font-size:16px;color:rgba(255,255,255,.5)}
  #alt a{color:rgba(255,255,255,.82)}
  #warn{margin-top:20px;font-size:16px;color:#ffb4b4;min-height:1.6em}
  ul{text-align:left;display:inline-block;color:rgba(255,255,255,.5);font-size:15px;
    margin:26px 0 0;padding-left:20px}
</style>
</head>
<body>
<main>
  <h1>동아리 박람회 퀴즈</h1>
  <p>버튼을 누르면 관리자 창이 새로 열리고, 이 창은 메인 화면으로 바뀝니다.</p>
  <button id="go">부스 시작</button>
  <div id="warn"></div>
  <div id="alt">따로 열려면 &nbsp;<a href="index.html">메인 화면</a>&nbsp;·&nbsp;<a href="admin.html">관리자 화면</a></div>
  <ul>
    <li>메인 창은 F11 로 전체화면. 관리자 창은 TF 쪽 화면에 두기</li>
    <li>두 창 모두 보이는 상태로 둘 것. 가리면 애니메이션이 멈춤</li>
    <li>메인은 하나만. 두 개 이상이면 관리자가 엉뚱한 문항을 띄움</li>
  </ul>
</main>
<script>
document.getElementById('go').addEventListener('click',function(){
  /* 클릭 한 번에 창을 두 개 열면 뒤엣것이 팝업 차단에 걸린다.
     관리자만 새 창으로 띄우고, 이 창 자체를 메인 화면으로 바꾼다. */
  var w=window.open('admin.html','kucc-admin','width=1200,height=950');
  if(!w){
    document.getElementById('warn').textContent=
      '팝업이 차단되었습니다. 주소창 오른쪽에서 허용한 뒤 다시 누르거나, 아래 링크로 따로 여세요.';
    return;
  }
  setTimeout(function(){location.replace('index.html');},400);
});
</script>
</body>
</html>
