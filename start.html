<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.png">
<title>부스 시작 — 동아리 박람회 퀴즈</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;
    font:400 20px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
  body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
  main{max-width:620px;text-align:center}
  h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
  p{color:rgba(255,255,255,.62);margin:0 0 30px;font-size:17px}
  button{font:700 24px/1 inherit;background:#fff;color:#000;border:0;
    padding:20px 46px;cursor:pointer;letter-spacing:.02em}
  button:hover{background:#ddd}
  #warn{margin-top:20px;font-size:16px;color:#ffb4b4;min-height:1.6em}
</style>
</head>
<body>
<main>
  <h1>동아리 박람회 퀴즈</h1>
  <p>버튼을 누르면 관리자 창이 새로 열리고, 이 창은 메인 화면으로 바뀝니다.</p>
  <button id="go">부스 시작</button>
  <div id="warn"></div>
</main>
<script>
document.getElementById('go').addEventListener('click',function(){
  /* 클릭 한 번에 창을 두 개 열면 뒤엣것이 팝업 차단에 걸린다.
     관리자만 새 창으로 띄우고, 이 창 자체를 메인 화면으로 바꾼다. */
  /* Pages 가 HTML 에 max-age=600 을 붙여 예전 파일이 10분간 남는다.
     시작 페이지에서 여는 창만이라도 매번 새로 받게 한다. */
  var v='?v='+Date.now();
  var w=window.open('admin.html'+v,'kucc-admin','width=1200,height=950');
  if(!w){
    document.getElementById('warn').textContent=
      '팝업이 차단되었습니다. 주소창 오른쪽에서 허용한 뒤 다시 눌러 주세요.';
    return;
  }
  setTimeout(function(){location.replace('index.html'+v);},400);
});
</script>
</body>
</html>
