<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="assets/favicon.png">
<title>동아리 박람회 퀴즈</title>
<style>
  @font-face{font-family:"HeirofLight";src:url("assets/fonts/HeirofLight-Regular.otf") format("opentype");
    font-weight:400;font-display:block}
  @font-face{font-family:"HeirofLight";src:url("assets/fonts/HeirofLight-Bold.otf") format("opentype");
    font-weight:700;font-display:block}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"HeirofLight",-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  /* 캔버스는 화면 전체를 덮는다. 16:9 설계 영역은 door.js 가 안쪽에 맞춰 앉힌다. */
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="rC"></canvas></div>
<svg id="rSvg" width="0" height="0" style="position:absolute;opacity:0;pointer-events:none"></svg>
<script type="module">
import * as quiz from './js/quiz.js';
import * as door from './js/door.js';
import {open} from './js/sync.js';

/* 문 애니메이션 초기화는 렌더러가 쥐고 있다(원본 restart 의 life=1, phase=0). */
quiz.hooks.onRestart=door.resetAnim;

/* 관리자 창의 채점 신호. 메인 창의 스페이스/Esc 와 같은 경로를 탄다. */
var ch=open('main',{state:quiz.snapshot,on:function(cmd){
if(cmd==='ok'){if(!quiz.Q.dead)quiz.next();}
else if(cmd==='ng'){if(!quiz.Q.dead)quiz.fail();}
else if(cmd==='undo')quiz.back();
else if(cmd==='lang')quiz.toggleLang();
else if(cmd==='giveup')quiz.giveUp();
else if(cmd==='restart')quiz.restart();}});
quiz.hooks.onState=function(s){ch.post(s);};

quiz.bindMainInput(door.canvas,door.toDesign);
/* 캔버스는 로드된 폰트만 쓸 수 있다. 첫 프레임 전에 두 굵기를 모두 받아 둔다. */
await Promise.all([
  document.fonts.load('400 25px "HeirofLight"'),
  document.fonts.load('700 25px "HeirofLight"')
]).catch(function(){});
await quiz.loadBank('data/questions.json');
quiz.build();
door.start();
</script>
</body>
</html>
